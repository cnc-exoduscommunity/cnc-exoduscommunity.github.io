# Site settings. Changes here need a server restart to show up locally.
title: "Exodus Community"
description: "Command & Conquer: Renegade - Exodus Co-Op community site."
lang: en

# cnc-exoduscommunity.github.io is an organization site served from the
# domain root, so there is no baseurl.
url: "https://cnc-exoduscommunity.github.io"
# GitHub repository, used to link the footer's revision line to its commit.
repository: "cnc-exoduscommunity/cnc-exoduscommunity.github.io"
baseurl: ""

# Header logo. If this file does not exist (or the line is removed), the
# header shows the site title as text instead.
logo: /assets/images/rg-logo.png

# Links shown in the header and on the home page.
discord_url: "https://discord.gg/vt4hURUG5a"
steam_url: "https://steamcommunity.com/groups/Exoduscommunity"
server:
  address: "85.215.107.108:4852"
  join_url: "renegade://85.215.107.108:4852"
  location: "Europe"
  # Live status (map, faction, players, time left), checked by the visitor's
  # browser every minute. First choice: CnCNet's public server list. Backup when
  # CnCNet doesn't list the server: status.json from the "Server status"
  # workflow, which asks the server itself every few minutes. Both show 0
  # players on Nod maps unless someone is on GDI (ExaBot's !pl is right).
  # Remove status_url to hide the live status.
  status_url: "https://api.cncnet.org/renegade?timeleft=&Time_Remaining=&_players=1&_callback="
  status_source_name: "CnCNet"
  status_source_url: "https://cncnet.org/renegade"
  direct_status_url: "https://raw.githubusercontent.com/cnc-exoduscommunity/cnc-exoduscommunity.github.io/server-status/status.json"

# Gallery section: every photo in assets/images/gallery/ (with a small copy of the
# same name in assets/images/gallery/thumbs/), oldest first. Photo names like
# 20250816183829_1 (Steam screenshots) give the date shown under each photo.
gallery:
  credit: RyanTurner

# Shown under "Join Server" for players who don't know how to connect.
connect_help:
  - name: CnCNet
    url: https://cncnet.org/renegade
  - name: W3D Hub
    url: https://w3dhub.com/
  - name: Tiberian Technologies
    url: https://www.tiberiantechnologies.org/

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - README.md
  - TODO.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
