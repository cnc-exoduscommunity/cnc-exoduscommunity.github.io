# Local preview only (tools/serve.bat / serve.sh add it after _config.yml).
# The sounds are 10,000+ small files: instead of Jekyll copying them into _site on every
# start (slow), tools/serve.rb links _site/assets/sounds to the real folder, and Jekyll
# leaves them alone. The GitHub build doesn't use this file, so the live site is unchanged.
exclude:
  - README.md
  - TODO.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - assets/sounds/
keep_files:
  - .git
  - .svn
  - assets/sounds
