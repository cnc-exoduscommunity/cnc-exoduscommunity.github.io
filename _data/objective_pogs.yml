# Objective pictures (the "pogs" the game shows for each objective), in assets/images/objectives/.
# Matched against the mission scripts from the released game source. kind: main = primary,
# side = secondary. action: the word shown under the picture on the HUD. Used by the
# "Objective" marks (Map marker tool), which show the picture on the map.
# The map names (M00 = M00_Tutorial, ...) are the keys.

M00_Tutorial:
  title: "Commando Training"
  pogs:
    - { file: "pog_m00_1_01", name: "Locate Advanced Guard Tower", kind: "main" }
    - { file: "pog_m00_1_02", name: "Locate Infantry Barracks", kind: "main" }
