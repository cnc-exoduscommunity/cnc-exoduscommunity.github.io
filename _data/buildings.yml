# Every kind of building: its name and its icon in assets/images/hud/ (hud:); without an
# icon it shows as a small labelled square (short:). Which buildings each map has is in
# _data/map_marks.yml (buildings:), edited with the Map marker tool. Decoy buildings
# (invisible stand-ins so the enemy team counts as having a base) are left out.

types:
  g_barracks: { name: "Infantry Barracks", hud: "hud_c&c_g_barracks" }
  g_wf:       { name: "Weapons Factory", hud: "hud_c&c_g_warfact" }
  g_ref:      { name: "Tiberium Refinery", hud: "hud_c&c_g_refinery" }
  g_pp:       { name: "Power Plant", hud: "hud_c&c_g_power" }
  agt:        { name: "Advanced Guard Tower", hud: "hud_c&c_g_guardtow" }
  n_hon:      { name: "Hand of Nod", hud: "hud_c&c_n_handof" }
  n_air:      { name: "Airstrip", hud: "hud_c&c_n_airstrip" }
  n_ref:      { name: "Tiberium Refinery", hud: "hud_c&c_n_refinery" }
  n_pp:       { name: "Power Plant", hud: "hud_c&c_n_power" }
  n_comm:     { name: "Communications Center", hud: "hud_c&c_n_comm" }
  obelisk:    { name: "Obelisk of Light", hud: "hud_c&c_oblisk" }
  turret:     { name: "Turret", short: "TUR" }
  guardtower: { name: "Guard Tower", short: "GT" }
  repairpad:  { name: "Repair Pad", short: "REP" }
  repairbay:  { name: "Repair Bay", short: "REP" }
  silo:       { name: "Tiberium Silo", short: "SILO" }
  helipad:    { name: "Helipad", short: "HELI" }
  shrine:     { name: "Shrine of Nod", short: "SHR" }
  ship:       { name: "USS M-Zero (the GDI ship acts as the base)", short: "SHIP" }

