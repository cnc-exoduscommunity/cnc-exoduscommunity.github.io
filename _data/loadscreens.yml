# Loading screens, from the game's always.dat (layout from campaign.ini [BackdropN],
# put together by the RenegadeViewer tool). Shown in the map preview ("Loading Screen").
#
# image:  the whole screen in assets/images/loadscreens/ (original name, as .webp; the
#         original PNGs and the four tiles each is made of - _1 top left, _2 top right,
#         _3 bottom left, _4 bottom right - stay on the PC, see .gitignore)
# maps:   which maps show it (names from _data/maps.yml). Every custom and co-op map
#         shows the C&C multiplayer screen.
# lines:  the text the game draws on top, on a 640x480 grid: x, y (top left of the
#         text), w (wrap width, when it wraps), big (the title), color (title, overview,
#         summary and hint #64ff64; hint boxes #ff9664; M13's HUD callouts white),
#         label (what the line is) and code (the game's string ID).
# note:   optional extra detail.

screens:
  - backdrop: 13
    image: "loadscreen m13 (13).webp"
    model: IF_LVL00LOAD
    tiles: loadscreen_lvl0
    maps: [M13]
    note: "Level 0; string IDs IDS_LoadScreen_MX0_*. Also shows HUD callouts in gold #f8e387: Primary Objective, Secondary Objective, Radar, Ammo Count, Armor, Clip Count, Health, Security Cards, Weapon. [Backdrop0] uses the same picture (loadscreen m13 (0).png) with no text."
    lines:
      - { x: 50, y: 17, big: true, color: "#64ff64", label: "Mission Title", code: IDS_LoadScreen_MX0_Title, text: "THE SCORPION HUNTERS" }
      - { x: 60, y: 40, color: "#64ff64", label: "Mission Overview", code: IDS_LoadScreen_MX0_SubTitle, text: "LOCATE THE SECRET NOD BASE" }
      - { x: 60, y: 60, w: 450, color: "#64ff64", label: "Mission Summary", code: IDS_LoadScreen_MX0_Description, text: "Intel is reporting evidence of an uncharted NOD installation. Storms and rough terrain are interfering with our satellite scans, so Eagle Base has dispatched a recon team to investigate. Your squad will lead the extraction effort once Recon One has confirmed the base coordinates." }
      - { x: 72, y: 154, color: "#ff9664", label: "1st Hint Title", code: IDS_LoadScreen_MX0_Hint_01_Title, text: "PRESS F1 FOR HELP" }
      - { x: 72, y: 166, w: 230, color: "#ff9664", label: "1st Hint Text", code: IDS_LoadScreen_MX0_Hint_01_Verbose, text: "For general help with the controls and on-screen interface, press the help key." }
      - { x: 82, y: 200, color: "#ff9664", label: "2nd Hint Title", code: IDS_LoadScreen_MX0_Hint_02_Title, text: "USE MOUSE TO AIM" }
      - { x: 82, y: 212, w: 220, color: "#ff9664", label: "2nd Hint Text", code: IDS_LoadScreen_MX0_Hint_02_Verbose, text: "Move the mouse to look around from your current position. Click to fire your weapon." }
      - { x: 368, y: 154, color: "#ff9664", label: "3rd Hint Title", code: IDS_LoadScreen_MX0_Hint_03_Title, text: "W-S-A-D TO MOVE" }
      - { x: 368, y: 166, w: 230, color: "#ff9664", label: "3rd Hint Text", code: IDS_LoadScreen_MX0_Hint_03_Verbose, text: "Move forward and backward with the W & S keys. Sidestep left and right with A & D." }
      - { x: 380, y: 200, color: "#ff9664", label: "4th Hint Title", code: IDS_LoadScreen_MX0_Hint_04_Title, text: "PRESS E FOR VEHICLES" }
      - { x: 380, y: 212, w: 220, color: "#ff9664", label: "4th Hint Text", code: IDS_LoadScreen_MX0_Hint_04_Verbose, text: "Enter and exit vehicles by pressing the action key when green arrows are present" }
      - { x: 112, y: 255, w: 500, color: "#f8e387", label: "Primary Objective", code: IDS_Enc_ObjTitle_Primary_M00_00, text: "Primary Objective" }
      - { x: 118, y: 280, color: "#f8e387", label: "Secondary Objective", code: IDS_Enc_ObjTitle_Secondary_M00_00, text: "Secondary Objective" }
      - { x: 142, y: 305, color: "#f8e387", label: "Radar", code: IDS_LoadScreen_Generic_Display_07, text: "Radar" }
      - { x: 456, y: 326, color: "#f8e387", label: "Ammo Count", code: IDS_LoadScreen_Generic_Display_02, text: "Ammo Count" }
      - { x: 170, y: 330, color: "#f8e387", label: "Health", code: IDS_LoadScreen_Generic_Display_05, text: "Health" }
      - { x: 454, y: 355, color: "#f8e387", label: "Clip Count", code: IDS_LoadScreen_Generic_Display_04, text: "Clip Count" }
      - { x: 440, y: 400, color: "#f8e387", label: "Weapon", code: IDS_LoadScreen_Generic_Display_08, text: "Weapon" }
      - { x: 260, y: 398, color: "#f8e387", label: "Armor", code: IDS_LoadScreen_Generic_Display_03, text: "Armor" }
      - { x: 134, y: 421, color: "#f8e387", label: "Security Cards", code: IDS_LoadScreen_Generic_Display_06, text: "Security Cards" }

