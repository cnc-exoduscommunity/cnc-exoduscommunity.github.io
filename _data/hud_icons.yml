    - { file: "hud_grana_ionc_hud_grana_ionc_upper", name: "Grenade Launcher" }
    - { file: "hud_grana_ionc_hud_grana_ionc_lower", name: "Personal Ion Cannon" }
    - { file: "hud_sg_lr_rg", name: "Shotgun + Laser Rifle + Rail Gun", sheet: true }
    - { file: "hud_sg_lr_rg_hud_sg_lr_rg_upper", name: "Shotgun" }
