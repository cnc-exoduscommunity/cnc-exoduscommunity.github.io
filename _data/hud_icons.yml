pickups:
  title: "Pickup icons"
  note: "The list that pops up when you pick something up. Drawn untinted."
  icons:
    - { file: "hud_health1", name: "Health", note: "pickups of 30 or less" }
    - { file: "hud_health2", name: "Health", note: "31 to 75" }
    - { file: "hud_health3", name: "Health", note: "more than 75" }
    - { file: "hud_armor3", name: "Armor", note: "30 or less" }
    - { file: "hud_armor2", name: "Armor", note: "31 to 75" }
    - { file: "hud_armor1", name: "Armor", note: "more than 75" }
    - { file: "hud_hemedal", name: "Augmented Health", note: "max health up" }
    - { file: "hud_armedal", name: "Augmented Armor", note: "max armour up" }
    - { file: "hud_keycard_green", name: "Security Card, green", note: "level 1" }
