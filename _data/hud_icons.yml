    - { file: "hud_c&c_g_conyard", name: "GDI Construction Yard", note: "not used in multiplayer" }
    - { file: "hud_c&c_oblisk", name: "Obelisk of Light" }
    - { file: "hud_c&c_n_refinery", name: "Nod Tiberium Refinery" }
    - { file: "hud_c&c_n_power", name: "Nod Power Plant" }
    - { file: "hud_c&c_n_handof", name: "Hand of Nod" }
