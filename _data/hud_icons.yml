# HUD icons from the game, in assets/images/hud/ (file names kept as in the game,
# e.g. hud_c&c_g_barracks.png). Names from the game's own data (purchase tables,
# weapon definitions, string table) and the code that draws each icon.
#
# file:  the file name without .png
# name:  the in-game name
# cost:  credits, for purchase cards (0 = free)
# note:  optional extra detail
#
# On a page, use _includes/hud-icon.html, which looks the name up here and writes
# the file's address with & turned into %26 (a raw & would break the link):
#   {% include hud-icon.html file="hud_c&c_g_barracks" %}

weapons:
  title: "Weapon icons"
  note: "Weapon bar and current weapon. Tinted in game: green #00FF00 for the selected weapon (the others in the bar at 50%), yellow #FFFF00 when out of ammo; the current-weapon icon in the corner is always green."
  icons:
    - { file: "hud_autoguns", name: "Automatic Rifle + Automatic Pistol", sheet: true }
    - { file: "hud_autoguns_hud_autoguns_upper", name: "Automatic Rifle" }
    - { file: "hud_autoguns_hud_autoguns_lower", name: "Automatic Pistol" }
