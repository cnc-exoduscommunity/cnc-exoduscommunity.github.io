# The purchase terminal's Characters and Vehicles pages, per side, in the game's order.
# Shown in the map preview when you click Characters or Vehicles on the terminal.
# hud:  the card picture in assets/images/hud/ (see _data/hud_icons.yml)
# cost: credits
# note: optional; "flying" = only on maps with flying vehicles (shown greyed out:
#       none of this server's maps are flying maps)

gdi:
  characters:
