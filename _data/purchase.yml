# The purchase terminal's Characters and Vehicles pages, per side, as in the stock game.
# Shown in the map preview when you click Characters or Vehicles on the terminal.
#
# Layout (like the game): 3 cards in row 1, 3 in row 2, the rest in row 3 (up to 4).
# The number on a card is the key that buys it (1-9, then 0). The two building icons
# (buildings:) sit on the right of rows 1 and 2.
#
# hud:   the card picture in assets/images/hud/ (see _data/hud_icons.yml)
# cost:  normal price in credits (it doubles while your Power Plant is down)
# looks: optional, how many looks the character has
# note:  optional; "flying" = only on maps that allow flying units (flying_maps below);
#        hidden everywhere else
#
# stock: the stock game, used by every map unless maps: below changes it.
# maps:  a map's own changes (from its map files), for the side the map is played on:
#        main_off: main-page card numbers that are "Not for sale"
#        characters / vehicles: a page that replaces the stock one
# These come from the map files only; the server's own scripts can still change what's
# for sale. The campaign missions have no purchase terminal (terminal: in maps.yml).


stock:
  gdi:
    characters:
      buildings: [hud_c&c_g_power, hud_c&c_g_barracks]
      cards:
