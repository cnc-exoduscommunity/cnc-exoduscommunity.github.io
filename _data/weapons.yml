# Weapon pictures for the "Starting weapons" lists in the map previews.
# name: as written under weapons: in _data/maps.yml (aliases: other names for it).
# image: file in assets/images/weapons/. A weapon without an entry shows its name only.
# hotkey: the number key that selects it in game (Prima's guide: 1 pistol,
#   2 automatic, 3 sniper, 4 chem, 5 rocket, 6 grenade, 7 energy/repair,
#   8 Tiberium, 9 C4, 0 beacons).
# Everyone also spawns with a Pistol (1) and Timed C4 (9) (shown as a note).
