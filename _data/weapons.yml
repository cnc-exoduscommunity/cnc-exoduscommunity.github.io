# Weapon pictures for the "Starting weapons" lists in the map previews.
# name: as written under weapons: in _data/maps.yml (aliases: other names for it).
# hud: the game's own HUD icon for it, a file name (without .png) in assets/images/hud/
#   (see _data/hud_icons.yml). Used instead of image: when set.
# image: file in assets/images/weapons/ (older renders / Prima's guide), used when
#   there's no hud: icon. A weapon without either shows its name only.
# hotkey: the number key that selects it in game (Prima's guide: 1 pistol,
#   2 automatic, 3 sniper, 4 chem, 5 rocket, 6 grenade, 7 energy/repair,
#   8 Tiberium, 9 C4, 0 beacons).
# versions: optional, when the game has more than one version (preset) of the weapon
#   with the same name and icon (not shown on the site yet).
# Everyone also spawns with a Pistol (1) and Timed C4 (9) (shown as a note).
- name: Maintenance Tool
  aliases: [Repair Gun]
  hud: hud_repairgun
  image: repair-gun.webp
  hotkey: 7
  versions: "the normal Repair Gun repairs 2, the C&C \"Special\" one 4"
