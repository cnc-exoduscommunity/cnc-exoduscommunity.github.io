# Map rotation, in the order the server plays them (in game: !rotation).
# name: the map file name. description: the map's name or what it is.
# note: optional extra detail, shown smaller under/after the description. `text` shows as a code box.
# images_from: use another map's images (e.g. Skirmish00 is played on Under).
# faction: GDI or Nod - the side players are on. Leave it out to show "-".
# objectives: what the map tells you to do (top left in game), one line per step.
#   Leave it out to show "-". The words GDI and Nod are shown as faction badges.
#   A step starting with "Optional:" is shown without a number.
#   A step that is just "?" is one not written down yet (keeps the numbers right).
# scalable_difficulty: true when the map has scalable difficulty (shown as a tag).
# weapons: the starting weapons on that map, one per line (shown in the map preview).
# map_weapons: weapons lying around on the map to pick up, one per line.
# image_credit: key from _data/credits.yml, shown under the map's preview.
# ingame_credit: the same for the in-game photo (assets/images/ingame/<name>.webp); default fandom.
# ingame_date: when that photo was taken (dd-mm-yyyy hh:mm), shown after its credit.
#
# terminal: what the purchase terminal sells on that map (shown in the map preview):
#   full               - infantry, characters and vehicles
#   no-vehicles        - no vehicles (the Vehicles button is greyed out)
#   vehicles-destroyed - a stock map where the vehicle building starts destroyed
#                        (the game shows "Destroyed" under Vehicles)
#   none               - no purchase terminal at all
#   Leave it out when it's not known yet. Beacons are never sold on this server
#   (server.beacons_for_sale in _config.yml).
#
# A map gets a clickable preview when assets/images/maps/<name>.webp
# (or .png / .jpg) exists, e.g. assets/images/maps/M01.webp.
