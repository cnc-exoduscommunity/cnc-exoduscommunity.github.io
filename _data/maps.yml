- name: Mesa
  description: Original multiplayer map, changed to allow co-op
  faction: GDI
  objectives:
    - Destroy all vehicles besieging our base as well as the 2 MCT's inside the tiberium cave.
    - This will unlock the vehicle side path to get out of the GDI base.
    - Destroy all enemy vehicles on the side path as well as the MCT to be able to cross the bridge.
    - Cross the bridge and destroy the enemy vehicles and the 2 MCT's.
    - Destroy the obelisk. The obelisk is the only building that can be destroyed from outside.
    - Destroy the Nod base and all Nod vehicles inside it to trigger the boss fight.
    - Kane has come (in person) to deal with you. Kill him and those who protect him.
    - Ion the pedestal.
