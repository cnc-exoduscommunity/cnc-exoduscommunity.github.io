- name: Volcano
  description: Original multiplayer map, changed to allow co-op
  faction: Nod
  objectives:
    - Our base has been overrun. Eliminate GDI (non-rocket) officers and Dead 6 to regain control.
    - Head for the field and destroy GDI vehicles and consoles to open the tunnel entrance there.
    - Find the 5 mini consoles inside the tunnels and destroy them.
    - Head back to base and go across the Tiberium field. Destroy the mammoth tank and console.
    - This will unlock vehicles back at the destroyed airstrip.
    - Now destroy that GDI base. The vehicles will come in handy here.
    - Destroy all GDI vehicles inside the GDI base in order to gain access to the GDI WF.
- name: Islands
  description: Original multiplayer map, changed to allow co-op
  faction: Nod
  objectives:
    - GDI has taken the field. Destroy all enemy vehicles and the mini console to reclaim it.
    - Well done. Now destroy the GDI base.
    - Base destroyed. Good Job. Now find that beacon in the tunnels and make Kane proud.
    - Destroy all GDI vehicles inside the GDI base in order to unlock the pedestal.
    - "Optional: Destroying GDI Guard Towers will allow Nod stealth units easy access."
- name: Hourglass
  description: Original multiplayer map, changed to allow co-op
  faction: Nod
  objectives:
    - Break the GDI siege by destroying enemy vehicles.
    - Now move out to the sides and destroy vehicles there to unlock the hill.
    - Destroy the Advanced Guard tower to unlock the side paths into GDI base.
    - Now destroy that GDI base from the inside!
    - Destroy all GDI vehicles inside the GDI base in order to gain access to the GDI WF.
    - Locke has been detected in the tunnels. Kill him and anyone who tries to protect him.
    - Now nuke the pedestal to end this. In the name of Kane.
